name: Android runtime smoke test

on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', '.github/workflows/smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test share, native engine, foreground service, gallery and MP3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb shell settings put system font_scale 1.0
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p ui-screenshots
            adb pull /sdcard/Pictures/NajmVidPreview/. ui-screenshots/
      - name: Upload runtime test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-runtime-test-results-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected/debug/
            ui-screenshots/

